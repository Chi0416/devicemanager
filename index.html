<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141a24" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="設備管理">
  <!-- 加到主畫面時的名稱與圖示 -->
  <link rel="manifest" href="manifest.json?v=2026.10.20.1">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>設備管理</title>
  <link rel="stylesheet" href="css/style.css?v=2026.10.20.1">
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="appbar-title">
        <h1 id="page-title">設備</h1>
      </div>
      <div class="appbar-actions">
        <!-- 新增：寫出會新增什麼（新增設備） -->
        <button id="btn-add" class="add-btn" type="button" aria-label="新增">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>新增<span class="add-what"></span></span>
        </button>
        <!-- 提醒：需要注意的事收在這裡（見 inbox.js），有未讀時顯示數字 -->
        <button id="btn-inbox" class="icon-btn inbox-btn" type="button" aria-label="提醒">
          <svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 20.6a2.2 2.2 0 0 0 4 0"/></svg>
          <span id="inbox-count" class="count-badge" hidden></span>
        </button>
        <button id="btn-menu" class="icon-btn" type="button" aria-label="設定：清單、雲端同步、資料備份">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
    </header>
    <!-- 上方切換：底部一格裡有好幾頁時，在標題下面左右切換（見 app.js 的 GROUPS） -->
    <div id="subtabs" class="subtabs" role="tablist" hidden></div>
    <div id="banner" class="banner" hidden></div>
    <!-- 同步提示：有資料還沒同步、太久沒同步、沒有網路、同步失敗時才出現（其他提醒在鈴鐺） -->
    <div id="sync-bar" class="sync-bar" role="status" hidden>
      <span class="sync-text"></span>
      <button type="button" class="sync-btn"></button>
    </div>
    <main id="panels"></main>
  </div>

  <nav class="tabbar">
    <div class="side-brand">設備管理</div>
    <div class="tabbar-inner" role="tablist">
      <button type="button" role="tab" data-tab="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
        <span>總覽</span>
      </button>
      <button type="button" role="tab" data-tab="locations">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
        <span>位置</span>
      </button>
      <button type="button" role="tab" data-tab="devices">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="11.5" rx="2"/><path d="M9 20h6M12 16v4"/></svg>
        <span>設備</span>
      </button>
      <!-- 紀錄：所有設備的保養、翻新、抄表、合約、異動 -->
      <button type="button" role="tab" data-tab="records">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16" rx="2.5"/><path d="M9 3.5h6v2.5H9zM8.5 10.5h7M8.5 14h7M8.5 17.5h4"/></svg>
        <span>紀錄</span>
      </button>
    </div>
  </nav>

  <!-- 新增／編輯表單 -->
  <dialog id="form-sheet" class="sheet">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-act="close">取消</button>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn strong" data-act="save">儲存</button>
    </div>
    <div class="sheet-body">
      <p class="sheet-status" hidden></p>
      <div class="fields"></div>
      <!-- 新增時才有：存好不關表單，接著填下一筆（保留類別、位置這些，編號跳下一號） -->
      <button type="button" class="wide-btn another" data-act="another" hidden>儲存，再新增一筆</button>
      <!-- 編輯時才有：以這筆為底新增一筆（合約的「重新簽約」），下面寫什麼時候用 -->
      <button type="button" class="wide-btn copy" data-act="copy" hidden></button>
      <p class="copy-note" hidden></p>
      <!-- 編輯時才有：修改紀錄（合約） -->
      <div class="form-history" hidden></div>
      <button type="button" class="wide-btn danger" data-act="delete" hidden>刪除這筆</button>
      <!-- 按了刪除之後：寫會刪掉什麼（再按一次才刪），或不能刪的原因 -->
      <p class="delete-note" hidden></p>
    </div>
  </dialog>

  <!-- 選好幾個的小視窗（見 picker.js）：合約的位置；照股票記錄簿「新增觀察的股票」的樣子 -->
  <dialog id="pick-sheet" class="sheet">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-act="close">取消</button>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn strong" data-act="done">完成</button>
    </div>
    <div class="sheet-body">
      <div class="field full">
        <label class="pick-label" for="pick-search"></label>
        <div class="combo">
          <input id="pick-search" class="pick-search" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
            aria-controls="pick-list" autocomplete="off" spellcheck="false" enterkeyhint="done">
          <div id="pick-list" class="combo-list" role="listbox" hidden></div>
        </div>
      </div>
      <h3 class="section-head pick-head"></h3>
      <ul class="member-list pick-rows"></ul>
    </div>
  </dialog>

  <!-- 設備詳情（見 detail.js）：點設備卡片打開；新增、編輯紀錄的表單開在這一頁上面 -->
  <dialog id="detail-sheet" class="sheet detail">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-act="close">返回</button>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn strong" data-act="edit">編輯</button>
    </div>
    <div class="sheet-body">
      <div class="detail-info"></div>
      <!-- 一張表一列：位置、合約、抄表、保養、翻新、配件 -->
      <ul class="member-list detail-rows"></ul>
    </div>
  </dialog>

  <!-- 設備詳情裡的一張表（見 detail.js）：這台設備的紀錄 -->
  <dialog id="sub-sheet" class="sheet">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-act="close">返回</button>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn strong" data-act="add">新增</button>
    </div>
    <div class="sheet-body"></div>
  </dialog>

  <!-- 位置詳情（見 detail.js 的 Place）：位置頁點一張卡片打開；設備詳情上點位置也會打開 -->
  <dialog id="place-sheet" class="sheet detail">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-act="close">返回</button>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn strong" data-act="edit">編輯</button>
    </div>
    <div class="sheet-body">
      <div class="detail-info"></div>
      <!-- 一張表一列：機器、合約、抄表、保養、翻新 -->
      <ul class="member-list detail-rows"></ul>
    </div>
  </dialog>

  <!-- 位置詳情裡的一張表：機器放在這個位置的期間的紀錄 -->
  <dialog id="place-sub-sheet" class="sheet">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-act="close">返回</button>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn strong" data-act="add">新增</button>
    </div>
    <div class="sheet-body"></div>
  </dialog>

  <!-- 總覽的「要處理」：點一列打開那份清單（見 overview.js） -->
  <dialog id="todo-sheet" class="sheet">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-act="close">返回</button>
      <h2 class="sheet-title"></h2>
      <span></span>
    </div>
    <div class="sheet-body">
      <ul class="member-list todo-rows"></ul>
      <p class="todo-none todo-empty" hidden>都處理好了</p>
    </div>
  </dialog>

  <!-- 設定：清單、雲端同步、資料備份 -->
  <dialog id="menu-sheet" class="sheet">
    <div class="sheet-head">
      <span></span>
      <h2 class="sheet-title">設定</h2>
      <button type="button" class="text-btn" data-act="close">關閉</button>
    </div>
    <div class="sheet-body">
      <!-- 清單：設備的類別、位置、品牌、保管人、廠商從這裡選（見 lists.js） -->
      <h3 class="section-head">清單</h3>
      <ul id="lists-menu" class="member-list lists-menu"></ul>

      <h3 class="section-head">Google 雲端硬碟</h3>
      <div id="cloud"></div>

      <h3 class="section-head">資料備份</h3>
      <dl id="stats" class="stats"></dl>
      <p id="last-export" class="muted"></p>
      <button id="btn-export" type="button" class="wide-btn primary">匯出 data.json</button>
      <button id="btn-import" type="button" class="wide-btn">匯入 data.json</button>
      <p class="note muted">匯入會以檔案內容取代目前所有資料。</p>
      <input id="file-import" type="file" accept=".json,application/json" hidden>

      <!-- 每次更新網站時改這裡，用來確認手機上開的是不是新版
           css、js 網址後面的 ?v= 也要一起改成同一個版本號，瀏覽器才會重新下載（tests/version.test.mjs 會檢查） -->
      <p class="note muted">版本 2026.10.20.1</p>
    </div>
  </dialog>

  <!-- 一份清單（見 lists.js）：從設定的「清單」打開 -->
  <dialog id="lists-sheet" class="sheet">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-act="close">返回</button>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn strong" data-act="add">新增</button>
    </div>
    <div class="sheet-body">
      <input class="lists-search" type="search" placeholder="搜尋" autocomplete="off" enterkeyhint="search" aria-label="搜尋清單">
      <div class="lists-body"></div>
    </div>
  </dialog>

  <!-- 提醒 -->
  <dialog id="inbox-sheet" class="sheet inbox">
    <div class="sheet-head">
      <button id="inbox-clear" type="button" class="text-btn">清除已讀</button>
      <h2 class="sheet-title">提醒</h2>
      <button type="button" class="text-btn" data-act="close">關閉</button>
    </div>
    <div class="sheet-body">
      <ul id="inbox-list" class="inbox-list"></ul>
      <div id="inbox-empty" class="inbox-empty" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 20.6a2.2 2.2 0 0 0 4 0"/></svg>
        <p>沒有提醒</p>
      </div>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/util.js?v=2026.10.20.1"></script>
  <script src="js/schema.js?v=2026.10.20.1"></script>
  <script src="js/storage.js?v=2026.10.20.1"></script>
  <script src="js/refs.js?v=2026.10.20.1"></script>
  <script src="js/records.js?v=2026.10.20.1"></script>
  <script src="js/list.js?v=2026.10.20.1"></script>
  <script src="js/form.js?v=2026.10.20.1"></script>
  <script src="js/picker.js?v=2026.10.20.1"></script>
  <script src="js/lists.js?v=2026.10.20.1"></script>
  <script src="js/detail.js?v=2026.10.20.1"></script>
  <script src="js/overview.js?v=2026.10.20.1"></script>
  <script src="js/places.js?v=2026.10.20.1"></script>
  <script src="js/config.js?v=2026.10.20.1"></script>
  <script src="js/google.js?v=2026.10.20.1"></script>
  <script src="js/sheet.js?v=2026.10.20.1"></script>
  <script src="js/sync.js?v=2026.10.20.1"></script>
  <script src="js/inbox.js?v=2026.10.20.1"></script>
  <script src="js/app.js?v=2026.10.20.1"></script>
  <!-- Google 登入元件（連結 Google 帳號時才用到，不擋住畫面載入） -->
  <script src="https://accounts.google.com/gsi/client" async></script>
</body>
</html>
